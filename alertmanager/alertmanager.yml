global:
  resolve_timeout: 1m

route:
  receiver: 'nginx-recovery'
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: 'nginx-recovery'
    webhook_configs:
      - url: 'http://host.docker.internal:5000/webhook'
        send_resolved: false
